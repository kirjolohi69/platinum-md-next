name: Linux build

on:
  push:
    # Tags are built through the release event below, not twice.
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Built on the oldest supported system so the bundled helpers also run on
    # Debian 12, Ubuntu 22.04 / Mint 21 and newer distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git python3 libusb-1.0-0-dev libgcrypt20-dev libjson-c-dev xvfb rpm
      - run: npm ci
      - run: npm test
      - run: npm run native
      - run: npm run test:native
      - run: npm run test:audio
      - run: npm run package:linux
      - run: npm run test:deb
      - run: npm run package:probe
      - name: Install Debian package
        run: sudo apt-get install -y ./release/*.deb
      - name: Check sandboxed desktop and preload
        env:
          PLATINUM_SMOKE_TEST: '1'
        run: |
          timeout 45s xvfb-run -a /usr/bin/platinum-md-next | tee desktop-smoke.log
          grep -q 'Desktop smoke test passed' desktop-smoke.log
      - name: Source archive and checksums
        run: |
          git archive --format=tar.gz --prefix=platinum-md-next/ HEAD > release/Platinum-MD-Next-source.tar.gz
          python3 scripts/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-amd64
          path: |
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # Install the packages on other distributions and check every library is found.
  distro:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - mirror.gcr.io/library/debian:12
          - mirror.gcr.io/library/debian:13
          - mirror.gcr.io/library/ubuntu:22.04
          - mirror.gcr.io/library/ubuntu:24.04
          - mirror.gcr.io/library/fedora:42
          - mirror.gcr.io/opensuse/tumbleweed:latest
          - mirror.gcr.io/opensuse/leap:15.6
          - mirror.gcr.io/library/archlinux:latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name linux-amd64 --dir release
      - run: bash scripts/test-distro.sh '${{ matrix.image }}'

  # Publishing a release on GitHub builds that tag and attaches the installers.
  attach-release:
    if: github.event_name == 'release'
    needs: [linux, distro]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name linux-amd64 --dir release
          deb="release/Platinum-MD-Next-${TAG#v}-linux-amd64.deb"
          if [ ! -f "$deb" ]; then
            echo "::error::The release tag $TAG does not match the app version in package.json. Expected $deb."
            ls release
            exit 1
          fi
          cd release && sha256sum --check --ignore-missing SHA256SUMS
          sha256sum ./*.deb ./*.rpm ./Platinum-MD-Next-source.tar.gz | sed 's# \./# #' > SHA256SUMS
          gh release upload "$TAG" ./*.deb ./*.rpm ./Platinum-MD-Next-source.tar.gz SHA256SUMS --clobber
