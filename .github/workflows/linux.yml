name: Linux Debian build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git python3 libusb-1.0-0-dev libgcrypt20-dev libjson-c-dev xvfb
      - run: npm ci
      - run: npm test
      - run: npm run native
      - run: npm run test:native
      - run: npm run test:audio
      - run: npm run package:linux
      - run: npm run test:deb
      - run: npm run package:probe
      - name: Install Debian package
        run: sudo apt-get install -y ./release/*.deb
      - name: Check sandboxed desktop and preload
        env:
          PLATINUM_SMOKE_TEST: '1'
        run: |
          timeout 45s xvfb-run -a /usr/bin/platinum-md-next | tee desktop-smoke.log
          grep -q 'Desktop smoke test passed' desktop-smoke.log
      - name: Source archive and checksums
        run: |
          git archive --format=tar.gz --prefix=platinum-md-next/ HEAD > release/Platinum-MD-Next-source.tar.gz
          python3 scripts/checksums.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-amd64
          path: |
            release/*.deb
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
